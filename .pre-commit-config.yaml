repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3 --write
        language: system
        types_or: [markdown, json]
      - id: cedar-compiled
        name: compiled Cedar matches YAML
        entry: uv run blind-policy compile --write
        language: system
        pass_filenames: false
        files: ^src/blind_policy/bundled/policies/
