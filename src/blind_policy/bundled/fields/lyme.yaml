  ecovariety: analysis
  avoidsum: analysis
  odo_vir: analysis
  proc_lot: analysis
  uc_cyne: analysis
  tx_1: analysis
  tm_1: analysis
  vpd_1: analysis
  presence: analysis
  adjacency: analysis
